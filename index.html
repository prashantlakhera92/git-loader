<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rotating Border Loader</title>

    <style>
      .github-container {
        height: 120px;
        width: 120px;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        font-weight: bold;
      }

      /* The rotating border */
      .github-container::before {
        content: "";
        position: absolute;
        height: 100%;
        width: 100%;
        border-radius: 50%;
        border: 10px solid lightgray; /* full border */
        border-top: 10px solid blue; /* rotating top color */
        animation: rotate 1s linear infinite;
      }

      /* Text stays still */
      .github-text {
        z-index: 5;
      }

      @keyframes rotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="github-container">
      <div class="github-text">Git-Hub</div>
    </div>
  </body>
</html>
